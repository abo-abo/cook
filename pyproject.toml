[project]
name = "pycook"
version = "0.12.0"
description = "Makefile -> Cookbook.py."
readme = { file = "README", content-type = "text/plain" }
license = "GPL-3.0-or-later"
authors = [
    { name = "Oleh Krehel", email = "ohwoeowho@gmail.com" }
]
keywords = ["makefile", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/abo-abo/cook"

[project.scripts]
sandbox = "pycook.sandbox:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-subprocess>=1.5.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pycook"]

[tool.hatch.build.targets.wheel.shared-data]
"README" = "cook/README"
"etc/bash-completion.sh" = "cook/bash-completion.sh"
"cook.el" = "cook/cook.el"
"etc/scripts.el" = "cook/scripts.el"
"etc/elpa.el" = "cook/elpa.el"

[tool.hatch.build.targets.sdist]
include = [
    "pycook/",
    "etc/",
    "cook.el",
    "README",
]

[tool.hatch.build.targets.wheel.force-include]
"etc/cook" = "bin/cook"
"etc/_cook_complete" = "bin/_cook_complete"
